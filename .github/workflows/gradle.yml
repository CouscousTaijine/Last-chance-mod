# Compile le mod "Dernière Chance" (Fabric 1.20.1) à chaque push sur main,
# et met le .jar compilé à disposition en téléchargement dans l'onglet
# "Actions" > (le run correspondant) > "Artifacts", sans avoir besoin
# d'un environnement Java local.

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle Wrapper
      id: build
      run: ./gradlew build --stacktrace > build_output.log 2>&1
      continue-on-error: true

    - name: Show build failure details
      if: steps.build.outcome == 'failure'
      shell: bash
      run: |
        LOG=$(tail -n 200 build_output.log)
        ESCAPED=$(printf '%s' "$LOG" | sed ':a;N;$!ba;s/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
        echo "::error::${ESCAPED}"
        exit 1

    - name: Upload compiled mod jar
      if: steps.build.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: derniere-chance-mod
        path: build/libs/*.jar
        if-no-files-found: error
